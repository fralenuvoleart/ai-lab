use_default_settings:
  engines:
    keep_only:
      - brave
      - mwmbl
      - wiby
      - reddit
      - marginalia
      - lemmy communities
      - lemmy posts
      - lemmy comments
      - mastodon hashtags
      - mastodon users
      - tootfinder
      - neocities
      - rawweb
      - wikinews
      - sepiasearch
      - radio browser
      - sina
      - yacy
      - searchmysite
      - ansa
      - tagesschau
      - il post
      - abcnyheter
      - hackernews
      - lobste.rs
      - boardreader
      #- ahmia # disabled: requires Tor
      - torch
server:
  secret_key: changeme
  bind_address: "0.0.0.0"
  limiter: false
  image_proxy: false
ui:
  static_use_hash: true
redis:
  url: redis://redis:6379/0
search:
  formats:
    - html
    - json
engines:
  - name: mwmbl
    engine: mwmbl
    disabled: false
    categories: [general]
  - name: wiby
    engine: json_engine
    disabled: false
    categories: [general]
    paging: true
    search_url: https://wiby.me/json/?q={query}&p={pageno}
    url_query: URL
    title_query: Title
    content_query: Snippet
  - name: reddit
    engine: reddit
    disabled: false
    categories: [general, social media]
  - name: marginalia
    engine: marginalia
    disabled: false
    inactive: false
    api_key: ""
    categories: [general]
  - name: lemmy communities
    engine: lemmy
    disabled: false
    categories: [general, social media]
  - name: lemmy posts
    engine: lemmy
    disabled: false
    categories: [general, social media]
  - name: lemmy comments
    engine: lemmy
    disabled: false
    categories: [general, social media]
  - name: mastodon hashtags
    engine: mastodon
    disabled: false
    categories: [general, social media]
  - name: mastodon users
    engine: mastodon
    disabled: false
    categories: [general, social media]
  - name: tootfinder
    engine: tootfinder
    disabled: false
    categories: [general, social media]
  - name: neocities
    engine: neocities
    disabled: false
    inactive: false
    categories: [general]
  - name: rawweb
    engine: json_engine
    disabled: false
    inactive: false
    categories: [general, blogs]
    paging: true
    search_url: 'https://api.rawweb.org/api/search?keyword={query}&page={pageno}&lang=*'
    results_query: data
    url_query: link
    title_query: title
    content_query: content
    title_html_to_text: true
    content_html_to_text: true
  - name: wikinews
    engine: mediawiki
    disabled: false
    categories: [general, news]
  - name: sepiasearch
    engine: sepiasearch
    disabled: false
    categories: [general]
  - name: radio browser
    engine: radio_browser
    disabled: false
    categories: [general]
  - name: yacy
    engine: yacy
    disabled: false
    categories: [general]
    search_type: text
    base_url: https://yacy.searchlab.eu
    search_mode: 'global'
    timeout: 5.0
  - name: searchmysite
    engine: xpath
    disabled: false
    categories: [general, blogs]
    paging: true
    search_url: https://searchmysite.net/search/?q={query}&page={pageno}
    results_xpath: //div[contains(@class,'search-result')]
    url_xpath: .//a[contains(@class,'result-link')]/@href
    title_xpath: .//span[contains(@class,'result-title-txt')]/text()
    content_xpath: ./p[@id='result-hightlight']
  - name: ansa
    engine: ansa
    disabled: false
    categories: [general, news]
  - name: tagesschau
    engine: tagesschau
    disabled: false
    categories: [general, news]
    use_source_url: true
  - name: il post
    engine: il_post
    disabled: false
    categories: [general, news]
  - name: abcnyheter
    engine: xpath
    disabled: false
    categories: [general]
    paging: true
    search_url: https://startsiden.abcnyheter.no/sok/?q={query}&page={pageno}
    results_xpath: //ul[contains(@class, "results__list")]/li[contains(@class, "result")]
    url_xpath: ./a/@href
    title_xpath: ./a/h3
    content_xpath: ./div
    language: "no"
  - name: hackernews
    engine: hackernews
    disabled: false
    categories: [general, it]
  - name: lobste.rs
    engine: xpath
    disabled: false
    categories: [general, it]
    search_url: https://lobste.rs/search?q={query}&what=stories&order=relevance
    results_xpath: //li[contains(@class, "story")]
    url_xpath: .//a[@class="u-url"]/@href
    title_xpath: .//a[@class="u-url"]
    content_xpath: .//a[@class="domain"]
    timeout: 5.0
  - name: boardreader
    engine: boardreader
    disabled: false
    categories: [general, social media]
  - name: ahmia
    engine: ahmia
    disabled: true
    categories: [general]
    timeout: 20.0
    enable_http: true
  - name: torch
    engine: xpath
    disabled: false
    categories: [general]
    paging: true
    search_url: http://xmh57jrknzkhv6y3ls3ubitzfqnkrwxhopf5aygthi7d6rplyvk3noyd.onion/cgi-bin/omega/omega?P={query}&DEFAULTOP=and
    results_xpath: //table//tr
    url_xpath: ./td[2]/a
    title_xpath: ./td[2]/b
    content_xpath: ./td[2]/small
    enable_http: true
