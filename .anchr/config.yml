      "Evidence Completeness",
      "Final Certification",
      "Deferred Items",
      "Anchr Graph",
      "Session History",
      "Session Log",
      "Signal Quality Trend",
      "Hard Stop History",
      "Last Signal",
      "Account"
    ]
  }
}
