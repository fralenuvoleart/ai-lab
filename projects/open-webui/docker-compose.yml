# ==============================================================================
# Experiment: Open WebUI — Self-hosted AI Chat Interface
# ==============================================================================

services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.5.20
    container_name: ailab-open-webui
    restart: unless-stopped
    ports:
      # Bound to localhost only — access via SSH tunnel or Caddy reverse proxy
      - "127.0.0.1:${WEBUI_PORT:-3000}:8080"
    volumes:
      - ./data:/app/backend/data
    # Resolve host.docker.internal on Linux so Ollama connections work
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # REQUIRED: must be set in .env or container starts with broken JWT auth
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY}
      WEBUI_AUTH: "true"
      ENABLE_SIGNUP: ${ENABLE_SIGNUP:-false}
      # API keys for programmatic access (Settings → Account → API Keys)
      ENABLE_API_KEYS: "true"
      USER_PERMISSIONS_FEATURES_API_KEYS: "true"
      # Show $ cost per message (set per-model pricing in Admin → Settings → Models)
      SHOW_COST_IN_CHAT: "true"
      # STT: force English to prevent misdetection (e.g. Spanish)
      WHISPER_LANG: en
      # RAG: API-based embeddings (offloads CPU from VPS)
      RAG_EMBEDDING_ENGINE: openai
      RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-openai/text-embedding-3-small}
      RAG_OPENAI_API_BASE_URL: ${RAG_OPENAI_API_BASE_URL:-https://openrouter.ai/api/v1}
      RAG_OPENAI_API_KEY: ${RAG_OPENAI_API_KEY:-}
      # API providers — configure in UI (Admin → Settings → Connections)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_API_BASE_URL: ${OPENAI_API_BASE_URL:-}
      # Tavily web search (AI-optimized results)
      ENABLE_WEB_SEARCH: ${ENABLE_WEB_SEARCH:-true}
      WEB_SEARCH_ENGINE: ${WEB_SEARCH_ENGINE:-tavily}
      WEB_SEARCH_RESULT_COUNT: ${WEB_SEARCH_RESULT_COUNT:-10}
      WEB_LOADER_ENGINE: ${WEB_LOADER_ENGINE:-tavily}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
    networks:
      - shared
    # API keys loaded from .env — rotate regularly and never commit .env to git
    env_file:
      - .env

networks:
  shared:
    name: ailab-shared
    external: true
