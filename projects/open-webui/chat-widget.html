<!--
  Open WebUI Chat Widget for WordPress
  =====================================
  Paste this entire block into a WordPress "Custom HTML" block or page.

  BEFORE USING:
  1. Generate an API key in your Open WebUI:
     https://ai.fralenuvole.art → User Settings → Account → API Keys
  2. Replace YOUR_API_KEY_HERE below with your actual key
  3. Adjust MODEL_NAME if you want a different default model
-->
<div id="owui-chat" style="max-width:700px;margin:0 auto;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;border:1px solid #e0e0e0;border-radius:12px;overflow:hidden;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,0.08)">
  <div id="owui-messages" style="height:400px;overflow-y:auto;padding:16px;background:#f9fafb"></div>
  <div style="display:flex;padding:12px;gap:8px;border-top:1px solid #e0e0e0;background:#fff">
    <input id="owui-input" type="text" placeholder="Ask anything..." style="flex:1;padding:10px 14px;border:1px solid #d1d5db;border-radius:8px;font-size:14px;outline:none" onkeydown="if(event.key==='Enter')owuiSend()">
    <button onclick="owuiSend()" style="padding:10px 20px;background:#2563eb;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:14px;font-weight:500">Send</button>
  </div>
</div>

<script>
(function(){
  const API_URL = 'https://ai.fralenuvole.art/api/chat/completions';
  const API_KEY = 'YOUR_API_KEY_HERE';   // ← REPLACE with your key
  const MODEL   = 'gemma2:2b';            // ← change model if needed

  const msgs = document.getElementById('owui-messages');
  const input = document.getElementById('owui-input');

  let history = [];

  function addMsg(role, text) {
    const d = document.createElement('div');
    d.style.cssText = 'margin-bottom:12px;padding:10px 14px;border-radius:10px;max-width:85%;font-size:14px;line-height:1.5;' +
      (role === 'user'
        ? 'background:#2563eb;color:#fff;margin-left:auto;text-align:right'
        : 'background:#fff;color:#1f2937;border:1px solid #e5e7eb');
    d.textContent = text;
    msgs.appendChild(d);
    msgs.scrollTop = msgs.scrollHeight;
  }

  function addStatus(text) {
    const d = document.createElement('div');
    d.id = 'owui-status';
    d.style.cssText = 'margin-bottom:8px;padding:8px 14px;border-radius:8px;font-size:13px;color:#6b7280;font-style:italic';
    d.textContent = text;
    msgs.appendChild(d);
    msgs.scrollTop = msgs.scrollHeight;
  }
  function removeStatus() {
    const s = document.getElementById('owui-status');
    if (s) s.remove();
  }

  let activeController = null;

  window.owuiSend = async function() {
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    input.disabled = true;

    addMsg('user', text);
    history.push({ role: 'user', content: text });
    addStatus('Thinking...');

    // Abort any in-flight request
    if (activeController) activeController.abort();
    activeController = new AbortController();
    const timeoutId = setTimeout(() => activeController.abort(), 30000);

    try {
      const resp = await fetch(API_URL, {
        method: 'POST',
        headers: {
          'Authorization': 'Bearer ' + API_KEY,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ model: MODEL, messages: history }),
        signal: activeController.signal
      });
      clearTimeout(timeoutId);

      if (!resp.ok) {
        removeStatus();
        const err = await resp.text();
        addMsg('assistant', 'Error ' + resp.status + ': ' + err.slice(0,200));
        return;
      }

      const data = await resp.json();
      removeStatus();

      const reply = data.choices?.[0]?.message?.content || '(empty response)';
      history.push({ role: 'assistant', content: reply });
      addMsg('assistant', reply);

      if (data.usage) {
        const u = document.createElement('div');
        u.style.cssText = 'font-size:11px;color:#9ca3af;margin-bottom:12px;text-align:right';
        u.textContent = data.usage.prompt_tokens + ' in / ' + data.usage.completion_tokens + ' out';
        msgs.appendChild(u);
      }

    } catch (e) {
      clearTimeout(timeoutId);
      removeStatus();
      if (e.name === 'AbortError') {
        addMsg('assistant', 'Request timed out. Please try again.');
      } else {
        addMsg('assistant', 'Connection error. Is the server reachable?');
      }
    }

    activeController = null;
    input.disabled = false;
    input.focus();
  };
})();
</script>
